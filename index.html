<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вместе — Dev Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a14;--bg2:#140f20;--bg3:#1c1629;--bg4:#241d33;
  --bd:#2a2240;--bd2:#3d3360;
  --acc:#f4729a;--acc2:#c96ce8;--acc3:#7b6cff;
  --ok:#3fcf8e;--warn:#f5a623;--bad:#ff5e5e;
  --txt:#ede8f5;--txt2:#9b91b8;--txt3:#5c5378;
  --thd:rgba(0,0,0,.15);--thd2:rgba(0,0,0,.2);--modal-bg:rgba(0,0,0,.65);
  --sw:228px;--hh:52px;--r:10px;
}
/* THEME: light (белая) */
html[data-theme="light"]{
  --bg:#f5f5f8;--bg2:#ffffff;--bg3:#f0eef5;--bg4:#e7e4ef;
  --bd:#e2dfea;--bd2:#cfc9dd;
  --acc:#e8558a;--acc2:#a84fd1;--acc3:#6a5ae0;
  --ok:#1fa870;--warn:#c9820a;--bad:#e14545;
  --txt:#1c1830;--txt2:#5c5578;--txt3:#948caa;
  --thd:rgba(0,0,0,.035);--thd2:rgba(0,0,0,.05);--modal-bg:rgba(20,15,30,.45);
}
/* THEME: dark (нейтральная тёмная) */
html[data-theme="dark"]{
  --bg:#0b0c0e;--bg2:#141517;--bg3:#1b1c1f;--bg4:#232427;
  --bd:#2a2b2f;--bd2:#3a3b40;
  --acc:#f4729a;--acc2:#c96ce8;--acc3:#7b6cff;
  --ok:#3fcf8e;--warn:#f5a623;--bad:#ff5e5e;
  --txt:#eceded;--txt2:#9a9ba1;--txt3:#5c5d63;
  --thd:rgba(0,0,0,.2);--thd2:rgba(0,0,0,.25);--modal-bg:rgba(0,0,0,.65);
}
*{margin:0;padding:0;box-sizing:border-box}
html{transition:background .15s}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:13px;min-height:100vh;overflow:hidden;transition:background .15s,color .15s}
#app{display:flex;height:100vh}
a{color:inherit;text-decoration:none}

/* THEME SWITCHER */
.theme-switch{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:3px}
.theme-btn{width:24px;height:24px;border-radius:6px;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;background:none;color:var(--txt3);transition:all .15s}
.theme-btn:hover{color:var(--txt)}
.theme-btn.active{background:var(--bg4);border-color:var(--bd2);color:var(--txt)}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}
#login-screen.hidden{display:none}
.login-box{width:360px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:36px 32px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.login-logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:18px}
.login-logo-sub{font-size:10px;color:var(--txt3);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.login-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;margin-bottom:6px}
.login-sub{font-size:12px;color:var(--txt3);margin-bottom:24px}
.login-err{display:none;font-size:12px;color:var(--bad);background:rgba(255,94,94,.1);border:1px solid rgba(255,94,94,.25);border-radius:7px;padding:9px 12px;margin-bottom:14px}
.login-err.show{display:block}

/* SIDEBAR */
#sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:14px}
.logo-sub{font-size:9px;color:var(--txt3);letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-sec{padding:10px 18px 3px;font-size:9px;color:var(--txt3);letter-spacing:1.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;color:var(--txt2);transition:all .15s;border-left:2px solid transparent;font-size:12.5px}
.nav-item:hover{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:rgba(244,114,154,.07);color:var(--acc);border-left-color:var(--acc)}
.nav-item .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--bd);font-size:11px;color:var(--txt3);display:flex;align-items:center;justify-content:space-between}
.conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle;transition:background .3s}
.conn-dot.ok{background:var(--ok);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.logout-btn{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:11px;padding:2px 4px;font-family:'Inter',sans-serif;transition:color .15s}
.logout-btn:hover{color:var(--bad)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;justify-content:space-between}
.header-bc{font-size:12px;color:var(--txt3)}
.header-bc span{color:var(--txt2)}
.header-right{display:flex;align-items:center;gap:8px}
#content{flex:1;overflow-y:auto;padding:20px}

/* PROFILE BUTTON */
.profile-btn{
  display:flex;align-items:center;gap:7px;
  background:var(--bg3);border:1px solid var(--bd);
  border-radius:8px;padding:5px 10px 5px 7px;
  cursor:pointer;transition:all .15s;color:var(--txt2);
  font-family:'Inter',sans-serif;font-size:12px;
}
.profile-btn:hover{border-color:var(--bd2);color:var(--txt)}
.profile-avatar{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}

/* BUTTONS */
.btn{background:var(--bg3);border:1px solid var(--bd);color:var(--txt2);padding:7px 13px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--bd2);color:var(--txt)}
.btn.acc{background:rgba(244,114,154,.1);border-color:var(--acc);color:var(--acc)}
.btn.acc:hover{background:rgba(244,114,154,.2)}
.btn.suc{background:rgba(63,207,142,.08);border-color:var(--ok);color:var(--ok)}
.btn.dan{background:rgba(255,94,94,.08);border-color:var(--bad);color:var(--bad)}
.btn.warn{background:rgba(245,166,35,.08);border-color:var(--warn);color:var(--warn)}
.btn.pur{background:rgba(123,108,255,.1);border-color:var(--acc3);color:var(--acc3)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.38;cursor:not-allowed}

/* FORM */
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--txt);padding:8px 11px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field input::placeholder,.field textarea::placeholder{color:var(--txt3)}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field select option{background:var(--bg3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-title{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.pur{background:var(--acc2)}

/* STAT CARDS */
.sc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:0;transition:opacity .2s}
.sc:hover::before{opacity:1}
.sl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.sv{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.ss{font-size:10px;color:var(--txt3);margin-top:4px}
.sv.pink{color:var(--acc)}.sv.purple{color:var(--acc2)}.sv.blue{color:var(--acc3)}.sv.ok{color:var(--ok)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 12px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--bd);font-weight:500;white-space:nowrap;background:var(--thd)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--txt2)}
th.sort-asc::after{content:' ↑';color:var(--acc)}
th.sort-desc::after{content:' ↓';color:var(--acc)}
td{padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--txt2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(244,114,154,.025)}
.td-act{display:flex;gap:6px;flex-wrap:wrap}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;letter-spacing:.3px;white-space:nowrap}
.bpk{background:rgba(244,114,154,.15);color:var(--acc)}
.bg{background:rgba(63,207,142,.12);color:var(--ok)}
.br{background:rgba(255,94,94,.12);color:var(--bad)}
.bw{background:rgba(245,166,35,.12);color:var(--warn)}
.bb{background:rgba(79,158,255,.12);color:#4f9eff}
.bpur{background:rgba(201,108,232,.12);color:var(--acc2)}
code{background:var(--bg4);border-radius:5px;padding:2px 6px;font-size:11px;color:var(--acc2);font-family:'JetBrains Mono',monospace}

/* MODAL */
#mo{display:none;position:fixed;inset:0;z-index:999;background:var(--modal-bg);backdrop-filter:blur(3px);align-items:center;justify-content:center}
#mo.open{display:flex}
.mo-box{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;padding:24px;width:500px;max-width:94vw;max-height:88vh;overflow-y:auto}
.mo-box.wide{width:680px}
.mo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mo-title{font-family:'Syne',sans-serif;font-weight:600;font-size:15px}
.mo-close{background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s}
.mo-close:hover{color:var(--txt)}
.mo-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* TOAST */
#toast{position:fixed;bottom:22px;right:22px;background:var(--bg3);border:1px solid var(--bd2);border-radius:9px;padding:11px 16px;font-size:12px;color:var(--txt);z-index:9999;transform:translateY(50px);opacity:0;transition:all .22s;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#toast.err{border-color:var(--bad);color:var(--bad)}
#toast.warn{border-color:var(--warn);color:var(--warn)}

/* MISC */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-head h2{font-family:'Syne',sans-serif;font-weight:600;font-size:16px}
.empty{color:var(--txt3);font-size:12px;padding:16px 0}
.divider{border:none;border-top:1px solid var(--bd);margin:16px 0}

/* SQL box */
.sql-box{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--txt2);white-space:pre-wrap;line-height:1.6;position:relative}
.sql-copy{position:absolute;top:8px;right:8px;background:var(--bg3);border:1px solid var(--bd);color:var(--txt3);cursor:pointer;font-size:10px;padding:3px 8px;border-radius:5px;font-family:'Inter',sans-serif;transition:all .15s}
.sql-copy:hover{color:var(--txt);border-color:var(--bd2)}

/* KV grid (user profile) */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.style-row{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.style-row-preview{flex-shrink:0}
.style-row-info{flex:1;min-width:180px}
.style-row-badges{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.style-color-dots{display:flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
.style-color-dots .dotc{width:16px;height:16px;border-radius:50%;border:1px solid var(--bd);flex-shrink:0}
.style-row-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.style-edit-head{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.style-edit-head>.style-edit-fields{flex:1;min-width:220px}
.color-picker-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.color-picker-row input[type=color]{width:32px;height:28px;border:none;background:none;cursor:pointer;padding:0;flex-shrink:0}
.color-picker-row .swatch{width:16px;height:16px;border-radius:4px;flex-shrink:0;border:1px solid var(--bd)}
.color-picker-row label{font-size:11px;color:var(--txt2);flex:1;min-width:80px}
.color-picker-row .hexlbl{font-size:10px;color:var(--txt3);font-family:'JetBrains Mono',monospace}
@media(max-width:480px){
  .style-row{flex-direction:column;align-items:stretch}
  .style-row-preview{align-self:center}
  .style-row-actions{width:100%}
  .style-row-actions .btn{flex:1}
}
.kvi{background:var(--bg3);border-radius:7px;padding:10px 12px;position:relative}
.kvi:hover .kv-edit-btn{opacity:1}
.kv-edit-btn{position:absolute;top:6px;right:6px;opacity:0;background:none;border:none;cursor:pointer;color:var(--txt3);font-size:12px;padding:2px 5px;transition:opacity .15s,color .15s;border-radius:4px;font-family:'Inter',sans-serif}
.kv-edit-btn:hover{color:var(--acc);background:rgba(244,114,154,.12)}
.kvk{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.kvv{font-size:12px;color:var(--txt);word-break:break-all}

/* IE rows */
.ie-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.ie-row:last-child{border-bottom:none}
.ie-key{color:var(--txt2);font-size:12px}
.ie-val{color:var(--txt);font-size:12px;font-family:'JetBrains Mono',monospace}
.ie-edit{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;transition:all .15s;font-family:'Inter',sans-serif}
.ie-edit:hover{color:var(--acc);background:rgba(244,114,154,.1)}

/* Source bar */
.src-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.src-fill{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));min-width:4px}
.src-name{font-size:11px;color:var(--txt2);width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-count{font-size:11px;color:var(--txt3);width:30px;text-align:right;flex-shrink:0}

/* Spinner */
.spin{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* formatting toolbar */
.fmt-bar{display:flex;gap:2px;padding:4px;background:var(--bg3);border:1px solid var(--bd);border-bottom:none;border-radius:8px 8px 0 0}
.fmt-bar .btn{border-radius:4px;padding:3px 8px;font-size:12px;min-width:28px;justify-content:center}
.fmt-bar+.field textarea,.fmt-bar~.field textarea{border-radius:0 0 8px 8px}

/* overview mini-activity */
.act-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px;background:var(--bg4)}
.act-dot.d1{background:rgba(244,114,154,.35)}
.act-dot.d2{background:rgba(244,114,154,.6)}
.act-dot.d3{background:rgba(244,114,154,.85)}
.act-dot.d4{background:var(--acc)}

/* filter row */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter-input{background:var(--bg3);border:1px solid var(--bd);color:var(--txt);padding:7px 12px;border-radius:8px;font:inherit;font-size:12px;outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--acc)}
.filter-input::placeholder{color:var(--txt3)}
select.filter-input{cursor:pointer}

/* user profile page */
.user-profile-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:18px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r)}
.user-avatar-lg{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;font-family:'Syne',sans-serif;font-weight:800;color:#fff;overflow:hidden}
.user-profile-name{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}
.user-profile-meta{font-size:11px;color:var(--txt3);margin-top:3px}

/* PROFILE PAGE */
.profile-page-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.profile-page-grid{grid-template-columns:1fr}}
.pf-avatar-wrap{width:110px;height:110px;border-radius:50%;margin:0 auto 14px;position:relative;cursor:pointer;flex-shrink:0}
.pf-avatar-circle{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;font-family:'Syne',sans-serif;color:#fff;overflow:hidden}
.pf-avatar-circle img{width:100%;height:100%;object-fit:cover}
.pf-avatar-wrap::after{content:'📷 Изменить';position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .15s;pointer-events:none}
.pf-avatar-wrap:hover::after{opacity:1}
.pf-role-badge{display:block;text-align:center;margin-top:2px}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* PERMISSION PILLS */
.pill-grid{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11px;border:1px solid var(--bd);color:var(--txt3);background:var(--bg3);white-space:nowrap}
.pill.on{border-color:rgba(63,207,142,.4);color:var(--ok);background:rgba(63,207,142,.08)}
.pill.editable{cursor:pointer;transition:all .12s;user-select:none}
.pill.editable:hover{border-color:var(--bd2)}
.role-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.role-card-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.role-card-title{display:flex;align-items:center;gap:9px;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;letter-spacing:.3px}
.role-card-actions{display:flex;gap:6px}
.role-access-summary{font-size:12px;color:var(--txt2);margin-bottom:8px}
.role-access-summary b{color:var(--txt)}

const PERM_GROUPS = [

function getRoleDef(key){
  if(BUILTIN_ROLES[key]) return {key, name:BUILTIN_ROLES[key].name, perms:BUILTIN_ROLES[key].perms, builtin:true};
  const custom=(window._customRoles||[]).find(r=>r.key===key);
  if(custom) return {key, name:custom.name, perms:custom.permissions||[], builtin:false, id:custom.id};
  return {key, name:key||'—', perms:['overview'], builtin:false, unknown:true};
}
function roleLabel(key){ return getRoleDef(key).name; }
function currentPerms(){
  if(!S.me) return [];
  if(S.me.role==='superadmin') return [...ALL_PERM_KEYS]; // суперадмин всегда видит всё — защита от блокировки самого себя

/* Разрешения хранятся как массив строк: 'ключ' = доступен просмотр, 'ключ:edit' = доступно и редактирование (подразумевает просмотр).
   У встроенных ролей (superadmin/admin/viewer) градации нет — если раздел виден, он и редактируется, как и раньше. */
function permHasView(perms,key){ return perms.includes(key)||perms.includes(key+':edit'); }
function permHasEdit(perms,key,builtin){ return builtin ? perms.includes(key) : perms.includes(key+':edit'); }
function canAccess(page){

  return permHasView(def.perms||[], page);

function canEditPage(page){

  if(S.me?.role==='superadmin') return true;
  const def=getRoleDef(S.me?.role);
  return permHasEdit(def.perms||[], page, def.builtin);

/* ══════════════ SIDEBAR: пункты меню + drag-n-drop сортировка ══════════════ */
const NAV_STRUCTURE = [
  {title:'Аналитика', items:[
    {page:'overview', label:'Сводка', icon:'◈'},
    {page:'users', label:'Пользователи', icon:'◉'},
    {page:'pending', label:'Незавершённые', icon:'⏳'},
    {page:'sources', label:'Источники', icon:'⬡'},
  ]},
  {title:'Монетизация', items:[
    {page:'promos', label:'Промокоды', icon:'◇'},

  ]},
  {title:'Контент', items:[
    {page:'cards', label:'Карточки', icon:'♥'},
    {page:'styles', label:'Стили карточек', icon:'◎'},
  ]},

    {page:'broadcast', label:'Рассылка', icon:'📣'},

  ]},

  ]},
];
const SIDEBAR_ORDER_KEY='vmeste_sidebar_order_v1';
const SIDEBAR_EDIT_KEY='vmeste_sidebar_edit_v1';

function loadSidebarOrder(){ try{ return JSON.parse(localStorage.getItem(SIDEBAR_ORDER_KEY)||'{}'); }catch(e){ return {}; } }
function saveSidebarOrder(order){ try{ localStorage.setItem(SIDEBAR_ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function isSidebarEditEnabled(){ return localStorage.getItem(SIDEBAR_EDIT_KEY)==='1'; }
function setSidebarEditEnabled(v){ localStorage.setItem(SIDEBAR_EDIT_KEY, v?'1':'0'); buildSidebarNav(); }

function orderedNavGroups(){
  const saved=loadSidebarOrder();
  return NAV_STRUCTURE.map(g=>{
    const savedOrder=saved[g.title];
    const items=[...g.items];
    if(Array.isArray(savedOrder)){
      items.sort((a,b)=>{
        const ia=savedOrder.indexOf(a.page), ib=savedOrder.indexOf(b.page);
        return (ia===-1?999:ia)-(ib===-1?999:ib);
      });
    }
    return {title:g.title, items};
  });
}

function buildSidebarNav(){
  const nav=document.getElementById('sidebar-nav');
  if(!nav) return;
  const editMode=isSidebarEditEnabled();
  nav.innerHTML = orderedNavGroups().map(g=>`
    <div class="nav-sec">${esc(g.title)}</div>
    <div class="nav-group" data-group="${esc(g.title)}">
      ${g.items.map(it=>`
        <div class="nav-item" data-page="${it.page}" ${editMode?'draggable="true"':''} onclick="${editMode?'':`go('${it.page}')`}">
          ${editMode?'<span class="drag-handle">⠿</span>':''}<span class="ic">${it.icon}</span>${esc(it.label)}
        </div>`).join('')}
    </div>`).join('');
  if(editMode) wireSidebarDrag(nav);
  applyNavPermissions();
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active', n.dataset.page===S.page));
}

let _dragSrcItem=null;
function wireSidebarDrag(nav){
  nav.querySelectorAll('.nav-item').forEach(item=>{
    // в режиме редактирования клик по плашке переключает страницу только если это не было перетаскивание
    item.addEventListener('click', ()=>{ if(!item.classList.contains('was-dragged')) go(item.dataset.page); item.classList.remove('was-dragged'); });
    item.addEventListener('dragstart', e=>{
      _dragSrcItem=item; item.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
    });
    item.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      if(_dragSrcItem===item) item.classList.add('was-dragged');
      _dragSrcItem=null;
      persistSidebarOrder();
    });
    item.addEventListener('dragover', e=>{
      e.preventDefault();
      if(!_dragSrcItem || _dragSrcItem===item) return;
      const group=item.closest('.nav-group');
      if(_dragSrcItem.closest('.nav-group')!==group) return; // перемещение только внутри своей группы
      const rect=item.getBoundingClientRect();
      const before=(e.clientY-rect.top) < rect.height/2;
      group.insertBefore(_dragSrcItem, before?item:item.nextSibling);
    });
  });
}
function persistSidebarOrder(){
  const order={};
  document.querySelectorAll('.nav-group').forEach(g=>{ order[g.dataset.group]=[...g.querySelectorAll('.nav-item')].map(n=>n.dataset.page); });
  saveSidebarOrder(order);
}

];

/* ══════════════ SUPABASE REST ══════════════ */
function rest(p){ return SB_URL.replace(/\/$/, '') + '/rest/v1/' + p; }
function hdrs(x={}){ return { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json', ...x }; }
async function api(path, opts={}){
  const r = await fetch(rest(path), {...opts, headers:hdrs(opts.headers||{})});
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error(t||'Supabase '+r.status); }
  if(r.status===204) return null;
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function sel(t,q='select=*'){ return (await api(t+'?'+q))||[]; }
async function ins(t,row){ return api(t,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(row)}); }
async function upd(t,q,row){ return api(t+'?'+q,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(row)}); }
async function del(t,q){ return api(t+'?'+q,{method:'DELETE'}); }

/* ══════════════ AUTH ══════════════ */
async function doLogin(){
  const login = document.getElementById('ls-login').value.trim();
  const pass  = document.getElementById('ls-pass').value;
  if(!login||!pass){ showLoginErr('Введи логин и пароль.'); return; }
  const btn = document.getElementById('ls-login-btn');
  btn.disabled=true; btn.textContent='Входим…';
  try{
    // сначала пробуем таблицу console_accounts
    let me = null;
    try{
      const rows = await sel('console_accounts',
        `select=*&login=eq.${encodeURIComponent(login)}&password_hash=eq.${encodeURIComponent(pass)}&is_active=eq.true&limit=1`);
      if(rows.length) me = rows[0];
    }catch(e2){
      // таблица не существует — первый запуск
      if(e2.message.includes('42P01')||e2.message.includes('does not exist')){
        me = {login, display_name: login, role:'superadmin'};
      } else { throw e2; }
    }
    if(!me){ showLoginErr('Неверный логин или пароль.'); return; }
    S.me = me;
    localStorage.setItem('vmeste_session', JSON.stringify(me));
    await loadRolesCache();
    startApp();
  }catch(e){ showLoginErr(e.message); }
  finally{ btn.disabled=false; btn.textContent='Войти'; }
}

function doLogout(){ localStorage.removeItem('vmeste_session'); location.reload(); }
function showLoginErr(m){ const el=document.getElementById('login-err'); el.textContent=m; el.classList.add('show'); }

async function startApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display='flex';
  renderHeaderAvatar();
  document.getElementById('profile-name').textContent = S.me.display_name||S.me.login;

  // кэш кастомных ролей нужен ДО построения меню и проверки доступа (важно при восстановлении сессии после F5)
  if(S.me.role!=='superadmin') await loadRolesCache().catch(()=>{});
  buildSidebarNav();
  const initial = parseHash();
  go(initial.page, initial.arg, true);
}

function renderHeaderAvatar(){

}

function profilePage(){

let _pendingAvatar=null;
function onAvatarSelect(input){
  const file=input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Выбери файл-изображение','err'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=async ()=>{
      // Обрезаем по центру в квадрат и уменьшаем — чтобы не раздувать базу
      const size=220;
      const canvas=document.createElement('canvas');
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      const s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      const dataUrl=canvas.toDataURL('image/jpeg',0.85);
      _pendingAvatar=dataUrl;
      const circle=document.getElementById('pf-avatar-circle');
      if(circle) circle.innerHTML=`<img src="${dataUrl}">`;
      await saveAvatar(dataUrl);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

async function saveAvatar(dataUrl){
  const id = await ensureMyAccountId();
  if(!id) return;
  try{
    await upd('console_accounts',`id=eq.${id}`,{avatar_base64:dataUrl});
    S.me.id=id; S.me.avatar_base64=dataUrl;
    localStorage.setItem('vmeste_session',JSON.stringify(S.me));
    renderHeaderAvatar();
    toast('Фото обновлено ✓','ok');
  }catch(e){
    if(e.message&&e.message.includes('avatar_base64')){
      toast('В таблице console_accounts нет колонки avatar_base64 — добавь её в Supabase (ALTER TABLE console_accounts ADD COLUMN avatar_base64 TEXT;)','err');
    } else { toast(e.message,'err'); }
  }
}

/* Подстраховка: если в сессии нет id (например, вход был через первый запуск без таблицы),
   пытаемся найти аккаунт по логину, чтобы сохранение не терялось молча. */
async function ensureMyAccountId(){
  if(S.me?.id) return S.me.id;
  try{
    const rows=await sel('console_accounts',`select=id&login=eq.${encodeURIComponent(S.me.login)}&limit=1`);
    if(rows.length){ S.me.id=rows[0].id; return rows[0].id; }
  }catch(e){}
  toast('Не удалось найти запись аккаунта в console_accounts — профиль хранится только локально в этой сессии','warn');
  return null;
}

async function saveProfilePage(){
  const name = document.getElementById('pf-name')?.value.trim();
  const pass = document.getElementById('pf-pass')?.value;
  const pass2 = document.getElementById('pf-pass2')?.value;
  if(pass || pass2){
    if(pass!==pass2){ toast('Пароли не совпадают','err'); return; }
    if(pass.length<4){ toast('Пароль слишком короткий','err'); return; }
  }
  if(!name){ toast('Имя не может быть пустым','err'); return; }
  const id = await ensureMyAccountId();
  if(!id){
    // нет записи в БД — сохраняем хотя бы в текущей сессии, чтобы не потерять правку
    S.me.display_name=name;
    document.getElementById('profile-name').textContent=name;
    localStorage.setItem('vmeste_session',JSON.stringify(S.me));
    return;
  }
  const fields={display_name:name};
  if(pass) fields.password_hash=pass;
  try{
    const updated = await upd('console_accounts',`id=eq.${id}`,fields);
    if(!updated || !updated.length){ toast('Запись не обновилась — проверь права доступа в Supabase','err'); return; }
    // подтягиваем актуальную запись из БД, чтобы не полагаться на локальное состояние
    S.me = {...S.me, ...updated[0]};
    localStorage.setItem('vmeste_session',JSON.stringify(S.me));
    document.getElementById('profile-name').textContent=S.me.display_name;
    document.getElementById('pf-pass').value=''; document.getElementById('pf-pass2').value='';
    toast('Профиль обновлён ✓','ok');
  }catch(e){ toast(e.message,'err'); }
}

const PAGE_TITLES = {overview:'Сводка',users:'Пользователи',pending:'Незавершённые',sources:'Источники',promos:'Промокоды',pricing:'Цены',cards:'Карточки',styles:'Стили карточек',broadcast:'Рассылка',contacts:'Контакты',admins:'Аккаунты',settings:'Настройки',database:'SQL Консоль',roles:'Роли и доступы',profile:'Мой профиль'};
const PAGE_FNS = {overview,users,pending,sources,promos,pricing,cards,styles,broadcast,contacts,admins,settings,database,userProfile,roles,profile:profilePage};

function parseHash(){
  const h=(location.hash||'').replace(/^#/,'');
  if(!h) return {page:'overview'};
  const [page,arg]=h.split('/');
  if(!PAGE_FNS[page]) return {page:'overview'};
  return {page, arg: arg!==undefined?decodeURIComponent(arg):undefined};
}
let _fromHash=false;
function go(page,arg,fromHash){
  if(!PAGE_FNS[page]) page='overview';
  if(!canAccess(page)){
    S.page=page; S.pageArg=arg;
    document.getElementById('page-title').textContent = PAGE_TITLES[page]||page;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
    set(accessDeniedHtml());
    toggleSidebar(false);
    return;
  }
  S.page=page; S.pageArg=arg;
  const h = arg!=null ? `${page}/${encodeURIComponent(arg)}` : page;
  if(!fromHash && location.hash.replace(/^#/,'')!==h){ history.replaceState(null,'',`#${h}`); }
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.getElementById('page-title').textContent = PAGE_TITLES[page]||page;
  (PAGE_FNS[page]||(() => set('<div class="empty">404</div>')))(arg);
  toggleSidebar(false);
  document.getElementById('content').scrollTop = 0;
}
window.addEventListener('hashchange', ()=>{
  if(!S.me) return;
  const {page,arg}=parseHash();
  if(page!==S.page || String(arg)!==String(S.pageArg)) go(page,arg,true);
});

function getSortedFilteredUsers(){
  const q = (_usersFilters.q||'').toLowerCase();
  const prem = _usersFilters.prem||'';
  const rem  = _usersFilters.rem||'';
  let rows = _usersData.filter(u=>{
    if(q && !String(u.tg_id).includes(q) && !(u.my_name||'').toLowerCase().includes(q) && !(u.partner_name||'').toLowerCase().includes(q)) return false;
    if(prem==='1' && !u.is_premium) return false;
    if(prem==='0' && u.is_premium) return false;
    if(rem==='1' && !u.reminder_enabled) return false;
    if(rem==='0' && u.reminder_enabled) return false;
    return true;
  });
  const {col,dir} = _usersSort;
  rows.sort((a,b)=>{
    let va=a[col]??'', vb=b[col]??'';
    if(typeof va==='boolean') va=va?1:0, vb=vb?1:0;
    const cmp = String(va).localeCompare(String(vb), undefined, {numeric:true});
    return dir==='asc'?cmp:-cmp;
  });
  return rows;
}

function sortUsers(col){
  if(_usersSort.col===col) _usersSort.dir = _usersSort.dir==='asc'?'desc':'asc';
  else { _usersSort.col=col; _usersSort.dir='asc'; }
  saveUiState({usersSort:_usersSort});
  renderUsersPage();
}

function getSortedFilteredPending(){
  const q = (_pendingFilters.q||'').toLowerCase();
  const nudge = _pendingFilters.nudge||'';
  let rows = _pendingData.filter(p=>{
    if(q && !String(p.tg_id).includes(q) && !(p.username||'').toLowerCase().includes(q) && !(p.first_name||'').toLowerCase().includes(q)) return false;
    if(nudge==='0' && p.nudge_count>0) return false;
    if(nudge==='1' && !(p.nudge_count>0)) return false;
    return true;
  });
  const {col,dir} = _pendingSort;
  rows.sort((a,b)=>{
    let va=a[col]??'', vb=b[col]??'';
    const cmp = String(va).localeCompare(String(vb), undefined, {numeric:true});
    return dir==='asc'?cmp:-cmp;
  });
  return rows;
}

function sortPending(col){
  if(_pendingSort.col===col) _pendingSort.dir = _pendingSort.dir==='asc'?'desc':'asc';
  else { _pendingSort.col=col; _pendingSort.dir='desc'; }

}

async function sendPendingMessage(tg_id){
  const text = (document.getElementById('pm-text')?.value||'').trim();
  if(!text){ toast('Введи текст сообщения','err'); return; }
  try{
    await ins('broadcasts',{
      created_by: S.me?.login||'console',
      audience:'specific',
      target_ids:[tg_id],
      text,
      status:'pending',
      sent_count:0,
      fail_count:0,
    });
    closeMo();
    toast('Сообщение поставлено в очередь ✓','ok');
  }catch(e){ toast(e.message,'err'); }
}

async function userProfile(tg_id){

async function loadCardHistory(tg_id){
  try{
    const logs = await sel('card_logs',`select=style,created_at&tg_id=eq.${tg_id}&order=created_at.desc&limit=50`);
    const block=document.getElementById('card-history-block');
    const body=document.getElementById('card-history-body');
    const cnt=document.getElementById('card-history-count');
    if(!block||!body) return;
    if(cnt) cnt.textContent=`(${logs.length})`;
    if(!logs.length){ body.innerHTML='<div class="empty">Карточки ещё не генерировались</div>'; return; }
    const byStyle={};
    for(const l of logs){ byStyle[l.style]=(byStyle[l.style]||0)+1; }
    const styleBar=Object.entries(byStyle).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`
      <span class="badge bpur" style="margin:0 2px">${esc(styleRu(s))} <strong>${n}</strong></span>
    `).join('');
    body.innerHTML=`
      <div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px">${styleBar}</div>
      <div class="tw"><table class="mini-table">
        <thead><tr><th>#</th><th>Стиль</th><th>Дата и время</th></tr></thead>
        <tbody>${logs.map((l,i)=>`<tr>
          <td style="color:var(--txt3)">${i+1}</td>
          <td><span class="badge bpur">${esc(styleRu(l.style))}</span></td>
          <td>${fd(l.created_at)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    `;
  }catch(e){
    const body=document.getElementById('card-history-body');
    if(body) body.innerHTML='<div class="empty" style="color:var(--txt3)">Нет данных (нужна таблица card_logs)</div>';
  }
}

function openFieldEdit(tg_id, key, val, type, optsStr, optLabelsStr){
  const opts = optsStr ? optsStr.split(',').filter(Boolean) : [];
  const optLabels = optLabelsStr ? Object.fromEntries(optLabelsStr.split(',').filter(Boolean).map(p=>{const [k,v]=p.split(':');return[k,v||k];})) : {};
  let inputHtml;
  if(type==='select' && opts.length){
    inputHtml = `<select id="fe-val" class="filter-input" style="width:100%">${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(optLabels[o]||o)}</option>`).join('')}</select>`;
  } else if(type==='date'){
    inputHtml = `<input id="fe-val" type="date" class="filter-input" style="width:100%" value="${esc(val)}">`;
  } else {
    inputHtml = `<input id="fe-val" class="filter-input" style="width:100%" value="${esc(val)}" placeholder="Новое значение">`;
  }
  openMo('Изменить: '+key,`
    <div class="field"><label>${key}</label>${inputHtml}</div>
    <div style="font-size:11px;color:var(--txt3);margin-top:-6px">Оставь пустым для null</div>
  `,[
    {l:'Отмена',c:'',o:'closeMo()'},
    {l:'Сохранить',c:'acc',o:`doFieldEdit(${tg_id},'${key}')`},
  ]);
}

async function doFieldEdit(tg_id, key){
  const val = document.getElementById('fe-val')?.value.trim();
  const data = {[key]: val===''?null:val};
  try{
    await upd('users',`tg_id=eq.${tg_id}`,data);
    closeMo();
    toast(`${key} обновлён ✓`,'ok');
    // обновляем кэш
    const idx = _usersData.findIndex(u=>u.tg_id==tg_id);
    if(idx!==-1) _usersData[idx][key] = val===''?null:val;
    renderUserProfilePage(_usersData[idx]||{tg_id});
  }catch(e){ toast(e.message,'err'); }
}

async function toggleUserBool(tg_id, key, val){
  try{
    await upd('users',`tg_id=eq.${tg_id}`,{[key]:val});
    toast(`${key} → ${val?'вкл':'выкл'}`,'ok');
    const idx=_usersData.findIndex(u=>u.tg_id==tg_id);
    if(idx!==-1){ _usersData[idx][key]=val; renderUserProfilePage(_usersData[idx]); }
  }catch(e){ toast(e.message,'err'); }
}

function _declineCard(n){
  if(11<=n%100&&n%100<=19) return 'дней';
  const r=n%10;
  if(r===1) return 'день';
  if(r>=2&&r<=4) return 'дня';
  return 'дней';
}

function cardPreview(){
  const canvas = document.getElementById('card-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=800, H=500;

  const myName = document.getElementById('cv-myname')?.value.trim() || 'Аня';
  const partnerName = document.getElementById('cv-partner')?.value.trim() || 'Миша';
  const dateVal = document.getElementById('cv-date')?.value;
  const styleKey = document.getElementById('cv-style')?.value || 'dark';
  const daysOverride = document.getElementById('cv-days-override')?.value;
  const s = CARD_STYLES[styleKey] || CARD_STYLES.dark;

  let days = 365;
  let startFmt = '14.02.2023';
  if(dateVal){
    const start = new Date(dateVal);
    const today = new Date();
    days = daysOverride ? parseInt(daysOverride) : Math.max(0, Math.floor((today-start)/86400000));
    startFmt = start.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
  }
  if(daysOverride) days = parseInt(daysOverride)||days;

  // Gradient background
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, s.bgTop);
  grad.addColorStop(1, s.bgBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Glow
  const glow = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,220);
  glow.addColorStop(0, s.accent+'22');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  // Card rect
  ctx.save();
  const rx=32, cx1=120, cy1=80, cx2=680, cy2=420;
  ctx.beginPath();
  ctx.moveTo(cx1+rx,cy1);
  ctx.lineTo(cx2-rx,cy1); ctx.quadraticCurveTo(cx2,cy1,cx2,cy1+rx);
  ctx.lineTo(cx2,cy2-rx); ctx.quadraticCurveTo(cx2,cy2,cx2-rx,cy2);
  ctx.lineTo(cx1+rx,cy2); ctx.quadraticCurveTo(cx1,cy2,cx1,cy2-rx);
  ctx.lineTo(cx1,cy1+rx); ctx.quadraticCurveTo(cx1,cy1,cx1+rx,cy1);
  ctx.closePath();
  ctx.fillStyle = s.accent+'1a';
  ctx.fill();
  ctx.strokeStyle = s.accent+'3c';
  ctx.lineWidth=1; ctx.stroke();
  ctx.restore();

  // Names
  ctx.fillStyle = s.accent;
  ctx.font = 'bold 34px Inter, sans-serif';
  ctx.textAlign = 'center';
  const namesText = `${myName} & ${partnerName}`;
  ctx.fillText(namesText, W/2, 150);

  // Divider
  ctx.strokeStyle = s.accent+'3c';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(200,168); ctx.lineTo(600,168); ctx.stroke();

  // Days number
  ctx.fillStyle = s.text;
  ctx.font = 'bold 96px Inter, sans-serif';
  ctx.fillText(String(days), W/2, 275);

  // Label
  ctx.fillStyle = s.label;
  ctx.font = '26px Inter, sans-serif';
  ctx.fillText(`${_declineCard(days)} вместе`, W/2, 310);

  // Divider 2
  ctx.beginPath(); ctx.moveTo(200,333); ctx.lineTo(600,333); ctx.stroke();

  // Start date
  ctx.fillStyle = s.muted;
  ctx.font = '20px Inter, sans-serif';
  ctx.fillText(`с ${startFmt}`, W/2, 358);

  // Heart
  ctx.fillStyle = s.accent;
  ctx.font = 'bold 28px Inter, sans-serif';
  ctx.fillText('♥', W/2, 392);

  // Watermark
  ctx.fillStyle = s.muted+'88';
  ctx.font = '20px Inter, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('@TogetherDayBot', W-20, H-15);
}

function downloadCard(){
  const canvas = document.getElementById('card-canvas');
  if(!canvas){ toast('Нет карточки для скачивания','err'); return; }
  const myName = document.getElementById('cv-myname')?.value.trim()||'card';
  const partnerName = document.getElementById('cv-partner')?.value.trim()||'';
  const a = document.createElement('a');
  a.download = `${myName}_${partnerName}_card.png`.replace(/\s+/g,'_');
  a.href = canvas.toDataURL('image/png');
  a.click();

async function loadUserIntoCard(){
  const uid = document.getElementById('cv-uid')?.value.trim();

  try{
    const rows = await sel('users',`select=my_name,partner_name,start_date,card_style&tg_id=eq.${encodeURIComponent(uid)}&limit=1`);
    if(!rows.length){ toast('Пользователь не найден','err'); return; }

    if(u.my_name) document.getElementById('cv-myname').value = u.my_name;
    if(u.partner_name) document.getElementById('cv-partner').value = u.partner_name;
    if(u.start_date) document.getElementById('cv-date').value = u.start_date;
    if(u.card_style) document.getElementById('cv-style').value = u.card_style;
    document.getElementById('cv-days-override').value = '';
    cardPreview();

  return `<div class="color-picker-row">

    <div class="swatch" style="background:${hex}"></div>
    <label>${label}</label>
    <span class="hexlbl">${hex}</span>
  </div>`;
}

function readColorPickers(prefix){
  const colors = {};
  for(const c of COLOR_FIELDS){
    const hex = document.getElementById(prefix+'-'+c.key)?.value;
    if(hex) colors[c.key] = hexToRgb(hex);
  }
  return colors;
}

function setupColorPreviewSync(prefix){
  for(const c of COLOR_FIELDS){
    const el = document.getElementById(prefix+'-'+c.key);
    if(!el) continue;
    el.addEventListener('input',()=>{
      const swatch = el.parentElement.querySelector('.swatch');
      if(swatch) swatch.style.background = el.value;
      const hexLabel = el.parentElement.querySelector('.hexlbl');
      if(hexLabel) hexLabel.textContent = el.value;
      updateStylePreview(prefix);
    });
  }
  setTimeout(()=>updateStylePreview(prefix),50);
}

function updateStylePreview(prefix){
  const colors = readColorPickers(prefix);
  const el = document.getElementById(prefix+'-preview');
  if(!el) return;
  const fakeStyle = {key:'preview',colors};
  el.innerHTML = `<div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Превью</div>` + stylePreviewHtml(fakeStyle);
}

async function syncColorsToDb(){
  let count = 0;
  for(const [key, def] of Object.entries(DEFAULT_STYLES)){
    try{
      const existing = _stylesData.find(s=>s.key===key);
      const colors = existing?.colors || def;
      if(existing?.id){
        await upd('card_styles',`id=eq.${existing.id}`,{colors});
      } else {
        await ins('card_styles',{key,name:def.name,is_premium:def.premium,is_enabled:true,sort_order:Object.keys(DEFAULT_STYLES).indexOf(key),colors:def});
      }
      count++;
    }catch(e){}
  }
  toast(`Цвета записаны для ${count} стилей ✓`,'ok');
  styles();
}

let _promosData=[], _promosSort={col:'status_order',dir:'asc'};
async function promos(){
  set(spinner());

      sel('promo_codes','select=*&order=used_count.desc'),
      sel('promo_uses','select=*&order=used_at.desc&limit=500'),

}

function getPromoStatus(p){
  if(p.expires_at && new Date(p.expires_at)<new Date()) return 'expired';
  if(p.max_uses && p.used_count>=p.max_uses) return 'limit';
  return 'active';
}

function renderPromosPage(uses){
  if(!uses) uses = _promosUses;
  const prevSearch = document.getElementById('pr-search')?.value ?? '';
  const prevStatus = document.getElementById('pr-status')?.value ?? '';
  const prevType = document.getElementById('pr-type')?.value ?? '';
  const prevUses = document.getElementById('pr-uses')?.value ?? '';

  let rows = _promosData.map(p=>({...p, _status:getPromoStatus(p)}));

  if(prevSearch) rows = rows.filter(p=>p.code.toLowerCase().includes(prevSearch.toLowerCase()));
  if(prevStatus) rows = rows.filter(p=>p._status===prevStatus);
  if(prevType==='free') rows = rows.filter(p=>p.is_free);
  if(prevType==='discount') rows = rows.filter(p=>!p.is_free);
  if(prevUses==='used') rows = rows.filter(p=>p.used_count>0);
  if(prevUses==='unused') rows = rows.filter(p=>!p.used_count);

  // Sort: active first by default
  rows.sort((a,b)=>{
    const order = {active:0,limit:1,expired:2};
    return (order[a._status]??3)-(order[b._status]??3);
  });

  // Uses data grouped by code
  const usesMap = {};
  if(uses){
    for(const u of uses){
      if(!usesMap[u.code]) usesMap[u.code]=[];
      usesMap[u.code].push(u);
    }
  }

  set(`
    <div class="section-head">
      <h2>Промокоды</h2>
      <button class="btn acc" onclick="openCreatePromo()">+ Создать промокод</button>
    </div>
    <div class="filter-row">
      <input class="filter-input" id="pr-search" placeholder="Поиск по коду…" style="width:180px" value="${esc(prevSearch)}" oninput="renderPromosPage()">
      <select class="filter-input" id="pr-status" onchange="renderPromosPage()">
        <option value="" ${prevStatus===''?'selected':''}>Все статусы</option>
        <option value="active" ${prevStatus==='active'?'selected':''}>Активные</option>
        <option value="expired" ${prevStatus==='expired'?'selected':''}>Истёкшие</option>
        <option value="limit" ${prevStatus==='limit'?'selected':''}>Лимит исчерпан</option>
      </select>
      <select class="filter-input" id="pr-type" onchange="renderPromosPage()">
        <option value="" ${prevType===''?'selected':''}>Все типы</option>
        <option value="free" ${prevType==='free'?'selected':''}>Free premium</option>
        <option value="discount" ${prevType==='discount'?'selected':''}>Скидка</option>
      </select>
      <select class="filter-input" id="pr-uses" onchange="renderPromosPage()">
        <option value="" ${prevUses===''?'selected':''}>Все использования</option>
        <option value="used" ${prevUses==='used'?'selected':''}>Использовались</option>
        <option value="unused" ${prevUses==='unused'?'selected':''}>Не использовались</option>
      </select>
      <span style="font-size:11px;color:var(--txt3)">Показано: ${rows.length}</span>
    </div>
    <div class="card" style="padding:0">
      <div class="tw">
        <table>
          <thead><tr><th>Код</th><th>Тип</th><th>Скидка</th><th>Использовано</th><th>Лимит</th><th>Активен до</th><th>Статус</th><th></th></tr></thead>
          <tbody>${rows.length?rows.map(renderPromoRow).join(''):'<tr><td colspan="8"><div class="empty">Промокодов нет. Создай первый!</div></td></tr>'}</tbody>
        </table>
      </div>
    </div>

    ${(uses && uses.length) ? `
    <div style="margin-top:20px">
      <div class="section-head"><h2 style="font-size:14px">История использований <span style="color:var(--txt3);font-size:12px;font-weight:400">(${uses.length})</span></h2></div>
      <div class="card" style="padding:0">
        <div class="tw">
          <table>
            <thead><tr><th>Дата</th><th>Промокод</th><th>TG ID</th></tr></thead>
            <tbody>${uses.slice(0,200).map(u=>`<tr>
              <td style="color:var(--txt3)">${fd(u.used_at)}</td>
              <td><code>${esc(u.code)}</code></td>
              <td><code>${u.tg_id}</code></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>` : ''}
  `);
}

/* Матрица «Просмотр / Редактирование» по каждому разделу.
   editable=true → чекбоксы (для формы создания/изменения роли), иначе → только отображение (карточки ролей). */
function permMatrixHtml(perms, editable, builtin){
  return `<div class="perm-matrix">${PERM_GROUPS.map(g=>`
    <div class="perm-matrix-group">
      <div class="perm-matrix-group-title">${esc(g.title)}</div>
      ${g.keys.map(([k,label])=>{
        const v=permHasView(perms,k), e=permHasEdit(perms,k,builtin);
        if(editable){
          return `<div class="perm-row" data-perm-key="${k}">
            <span class="perm-row-label">${esc(label)}</span>
            <label class="perm-check"><input type="checkbox" class="perm-view" ${v?'checked':''} onchange="onPermViewChange(this)"> Просмотр</label>
            <label class="perm-check"><input type="checkbox" class="perm-edit" ${e?'checked':''} onchange="onPermEditChange(this)"> Редактирование</label>
          </div>`;
        }
        return `<div class="perm-row readonly">
          <span class="perm-row-label">${esc(label)}</span>
          <span class="perm-flag ${v?'on':''}">${v?'✓':'—'} Просмотр</span>
          <span class="perm-flag ${e?'on':''}">${e?'✓':'—'} Редактирование</span>
        </div>`;
      }).join('')}
    </div>
  `).join('')}</div>`;
}
function onPermViewChange(el){
  if(!el.checked){ const ed=el.closest('.perm-row').querySelector('.perm-edit'); if(ed) ed.checked=false; }
}
function onPermEditChange(el){
  if(el.checked){ const v=el.closest('.perm-row').querySelector('.perm-view'); if(v) v.checked=true; }
}
function collectEditedPerms(){
  const perms=[];
  document.querySelectorAll('#mb .perm-row[data-perm-key]').forEach(row=>{
    const k=row.dataset.permKey;
    const v=row.querySelector('.perm-view')?.checked;
    const e=row.querySelector('.perm-edit')?.checked;
    if(e) perms.push(k+':edit');
    else if(v) perms.push(k);
  });
  return perms;
}

/* Свёрнутый блок доступа роли — полную матрицу «Просмотр/Редактирование» видно только Super Admin */
let _roleDetailsSeq=0;
function roleAccessSummary(perms, builtin){
  let viewCount=0, editCount=0;
  ALL_PERM_KEYS.forEach(k=>{ if(permHasView(perms,k)) viewCount++; if(permHasEdit(perms,k,builtin)) editCount++; });
  return {viewCount, editCount, total:ALL_PERM_KEYS.length};
}
function roleAccessBlockHtml(perms, builtin){
  const {viewCount,editCount,total} = roleAccessSummary(perms,builtin);
  const summaryLine = `<div class="role-access-summary">Доступно разделов: <b>${viewCount}/${total}</b> · с редактированием: <b>${editCount}</b></div>`;
  if(S.me?.role!=='superadmin'){
    return `${summaryLine}<div class="role-access-locked">🔒 Подробный список прав по разделам виден только роли Super Admin</div>`;
  }
  const id='role-details-'+(_roleDetailsSeq++);
  return `
    ${summaryLine}
    <button class="btn sm" id="${id}-btn" onclick="toggleRoleDetails('${id}')">▸ Показать доступ по разделам</button>
    <div id="${id}" class="perm-matrix-wrap" style="display:none">${permMatrixHtml(perms,false,builtin)}</div>
  `;
}
function toggleRoleDetails(id){
  const wrap=document.getElementById(id), btn=document.getElementById(id+'-btn');
  if(!wrap) return;
  const show = wrap.style.display==='none';
  wrap.style.display = show?'':'none';
  if(btn) btn.textContent = show?'▾ Скрыть доступ по разделам':'▸ Показать доступ по разделам';
}

/* Markdown formatting toolbar */
function bcFormat(type){
  const ta=document.getElementById('bc-text');
  if(!ta) return;
  const start=ta.selectionStart, end=ta.selectionEnd;
  const sel=ta.value.substring(start,end);
  let before='', after='';
  if(type==='bold'){ before='*'; after='*'; }
  else if(type==='italic'){ before='_'; after='_'; }
  else if(type==='strike'){ before='~'; after='~'; }
  else if(type==='code'){ before='`'; after='`'; }
  else if(type==='link'){
    if(sel){ before='['; after='](https://)'; }
    else { before='['; after='](https://)'; }
  }
  const replacement=sel?(before+sel+after):(before+after);
  ta.setRangeText(replacement,start,end,'select');
  ta.focus();
  if(!sel){
    ta.selectionStart=start+before.length;
    ta.selectionEnd=start+before.length;
  }
  bcPreview();
}

function bcPreview(){
  const ta=document.getElementById('bc-text');
  const preview=document.getElementById('bc-preview');
  if(!ta||!preview) return;
  const text=ta.value;
  if(!text.trim()){ preview.style.display='none'; return; }
  preview.style.display='block';
  let html=esc(text);
  html=html.replace(/\*(.+?)\*/g,'<strong>$1</strong>');
  html=html.replace(/_(.+?)_/g,'<em>$1</em>');
  html=html.replace(/~(.+?)~/g,'<s>$1</s>');
  html=html.replace(/`(.+?)`/g,'<code style="background:var(--bg4);padding:1px 4px;border-radius:3px;font-size:11px">$1</code>');
  html=html.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" style="color:var(--acc)">$1</a>');
  preview.innerHTML=html;
}

async function doSendBroadcast(){
  const aud=document.getElementById('bc-aud')?.value||'all';
  const text=(document.getElementById('bc-text')?.value||'').trim();
  if(!text){ toast('Введи текст рассылки','err'); return; }

  let targetIds=[];
  if(aud==='pending'){
    try{
      const rows=await sel('pending_users','select=tg_id');
      targetIds=rows.map(r=>r.tg_id);
    }catch(e){ toast('Не удалось получить pending-юзеров: '+e.message,'err'); return; }
    if(!targetIds.length){ toast('Нет pending-пользователей','warn'); return; }
  } else if(aud==='specific'){
    targetIds=[..._bcDraftIds];
    if(!targetIds.length){ toast('Выбери хотя бы одного пользователя','err'); return; }
  }

  let mediaBase64=null, mediaType=null;
  if(_bcMediaFile){
    try{
      const buf=await _bcMediaFile.arrayBuffer();
      const bytes=new Uint8Array(buf);
      let binary=''; for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
      mediaBase64=btoa(binary);
      mediaType=_bcMediaFile.type||'image/png';
    }catch(e){ toast('Ошибка чтения файла: '+e.message,'err'); return; }
  }

  const audience = aud==='pending'?'specific':aud;
  const payload={
    created_by: S.me?.login||'console',
    audience,
    target_ids: targetIds,
    text,
    status:'pending',
    sent_count:0,
    fail_count:0,
  };
  if(mediaBase64 && mediaType){
    payload.media_base64 = mediaBase64;
    payload.media_type = mediaType;
  }
  try{
    await ins('broadcasts',payload);
    closeMo();
    toast('Рассылка поставлена в очередь ✓','ok');
    broadcast();
  }catch(e){
    if(e.message&&e.message.includes('column')&&e.message.includes('media')){
      toast('Таблица broadcasts не поддерживает медиа. Выполни SQL в БД:\nALTER TABLE broadcasts ADD COLUMN media_base64 TEXT;\nALTER TABLE broadcasts ADD COLUMN media_type TEXT;','err');
    } else { toast(e.message,'err'); }
  }
}

      </div>
    </div>
  `);
}
function dbFillExample(){ document.getElementById('db-endpoint').value='users?select=count'; document.getElementById('db-method').value='GET'; }
function dbToggleBody(){
  const m=document.getElementById('db-method')?.value;
  document.getElementById('db-body-wrap').style.display=(m==='POST'||m==='PATCH')?'block':'none';
}
function dbQuickRun(q){
  document.getElementById('db-endpoint').value=q;
  document.getElementById('db-method').value='GET';
  dbToggleBody();
  dbRunQuery();
}
async function dbRunQuery(){
  const method=document.getElementById('db-method')?.value||'GET';
  const path=document.getElementById('db-endpoint')?.value.trim();
  const boxEl=document.getElementById('db-result-box');
  if(!path){ toast('Введи endpoint','err'); return; }
  let body, headers={};
  if(method==='POST'||method==='PATCH'){
    const raw=document.getElementById('db-body')?.value.trim();
    if(raw){
      try{ JSON.parse(raw); body=raw; }
      catch{ toast('Некорректный JSON в теле запроса','err'); return; }
    }
    headers.Prefer='return=representation';
  }
  boxEl.style.color=''; boxEl.textContent='Выполняется…';
  try{
    const result = await api(path, {method, headers, body});
    boxEl.textContent = JSON.stringify(result, null, 2) ?? 'OK (пустой ответ)';
  }catch(e){
    boxEl.style.color='var(--bad)';
    boxEl.textContent = e.message;
  }
}

/* ══════════════ HELPERS ══════════════ */
function esc(v){ return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
function fd(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch{ return d; } }
function spinner(){ return '<div style="color:var(--txt3);padding:40px 0;text-align:center"><span class="spin"></span></div>'; }
function errBox(e){ return `<div class="card"><div style="color:var(--bad);margin-bottom:6px">Ошибка загрузки</div><div style="color:var(--txt3);font-size:12px;white-space:pre-wrap">${esc(e.message)}</div></div>`; }
function setConn(ok){ document.getElementById('conn-dot').className='conn-dot'+(ok?' ok':''); document.getElementById('conn-label').textContent=ok?'Подключено':'Нет соединения'; }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('Скопировано ✓','ok'); }catch{ toast('Не удалось скопировать','err'); } }
function sc(label,val,sub,accent){ const cls=accent==='pink'?'pink':accent==='purple'?'purple':accent==='blue'?'blue':accent==='ok'?'ok':''; return `<div class="sc"><div class="sl">${label}</div><div class="sv ${cls}">${esc(String(val))}</div><div class="ss">${sub}</div></div>`; }
function sqlBox(sql){ const id='sql_'+Math.random().toString(36).slice(2,8); return `<div class="sql-box" id="${id}">${esc(sql)}<button class="sql-copy" onclick="copyText(document.getElementById('${id}').textContent.replace('Копировать','').trim())">Копировать</button></div>`; }
function kv(label,val){ return `<div class="kvi"><div class="kvk">${label}</div><div class="kvv">${esc(val)}</div></div>`; }

let _toastT;
function toast(msg,type=''){ const el=document.getElementById('toast'); el.textContent=msg; el.className='show'+(type?' '+type:''); clearTimeout(_toastT); _toastT=setTimeout(()=>{el.className='';},2800); }

function openMo(title,body,actions=[]){
  document.getElementById('mo-box').classList.remove('wide');
  document.getElementById('mt').textContent=title;
  document.getElementById('mb').innerHTML=body;
  document.getElementById('ma').innerHTML=actions.map(a=>`<button class="btn ${a.c||''}" onclick="${a.o}">${a.l}</button>`).join('');
  document.getElementById('mo').classList.add('open');
}
function closeMo(e){ if(e&&e.target!==document.getElementById('mo')) return; document.getElementById('mo').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('mo').classList.remove('open'); });

/* ══════════════ BOOTSTRAP ══════════════ */
(function init(){
  initTheme();
  const saved=localStorage.getItem('vmeste_session');
  if(saved){ try{ S.me=JSON.parse(saved); startApp(); return; }catch{} }
  // Enter key on login
  document.getElementById('ls-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('ls-login').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('ls-pass').focus(); });
})();
</script>
