<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вместе — Dev Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a14;--bg2:#140f20;--bg3:#1c1629;--bg4:#241d33;
  --bd:#2a2240;--bd2:#3d3360;
  --acc:#f4729a;--acc2:#c96ce8;--acc3:#7b6cff;
  --ok:#3fcf8e;--warn:#f5a623;--bad:#ff5e5e;
  --txt:#ede8f5;--txt2:#9b91b8;--txt3:#5c5378;
  --sw:228px;--hh:52px;--r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:13px;min-height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
a{color:inherit;text-decoration:none}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}
#login-screen.hidden{display:none}
.login-box{width:360px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:36px 32px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.login-logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:18px}
.login-logo-sub{font-size:10px;color:var(--txt3);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.login-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:600;margin-bottom:6px}
.login-sub{font-size:12px;color:var(--txt3);margin-bottom:24px}
.login-err{display:none;font-size:12px;color:var(--bad);background:rgba(255,94,94,.1);border:1px solid rgba(255,94,94,.25);border-radius:7px;padding:9px 12px;margin-bottom:14px}
.login-err.show{display:block}

/* SIDEBAR */
#sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:14px}
.logo-sub{font-size:9px;color:var(--txt3);letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-sec{padding:10px 18px 3px;font-size:9px;color:var(--txt3);letter-spacing:1.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;color:var(--txt2);transition:all .15s;border-left:2px solid transparent;font-size:12.5px}
.nav-item:hover{background:var(--bg3);color:var(--txt)}
.nav-item.active{background:rgba(244,114,154,.07);color:var(--acc);border-left-color:var(--acc)}
.nav-item .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--bd);font-size:11px;color:var(--txt3);display:flex;align-items:center;justify-content:space-between}
.conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle;transition:background .3s}
.conn-dot.ok{background:var(--ok);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.logout-btn{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:11px;padding:2px 4px;font-family:'Inter',sans-serif;transition:color .15s}
.logout-btn:hover{color:var(--bad)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{height:var(--hh);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;justify-content:space-between}
.header-bc{font-size:12px;color:var(--txt3)}
.header-bc span{color:var(--txt2)}
.header-right{display:flex;align-items:center;gap:8px}
#content{flex:1;overflow-y:auto;padding:20px}

/* PROFILE BUTTON */
.profile-btn{
  display:flex;align-items:center;gap:7px;
  background:var(--bg3);border:1px solid var(--bd);
  border-radius:8px;padding:5px 10px 5px 7px;
  cursor:pointer;transition:all .15s;color:var(--txt2);
  font-family:'Inter',sans-serif;font-size:12px;
}
.profile-btn:hover{border-color:var(--bd2);color:var(--txt)}
.profile-avatar{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}

/* BUTTONS */
.btn{background:var(--bg3);border:1px solid var(--bd);color:var(--txt2);padding:7px 13px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--bd2);color:var(--txt)}
.btn.acc{background:rgba(244,114,154,.1);border-color:var(--acc);color:var(--acc)}
.btn.acc:hover{background:rgba(244,114,154,.2)}
.btn.suc{background:rgba(63,207,142,.08);border-color:var(--ok);color:var(--ok)}
.btn.dan{background:rgba(255,94,94,.08);border-color:var(--bad);color:var(--bad)}
.btn.warn{background:rgba(245,166,35,.08);border-color:var(--warn);color:var(--warn)}
.btn.pur{background:rgba(123,108,255,.1);border-color:var(--acc3);color:var(--acc3)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.38;cursor:not-allowed}

/* FORM */
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--txt);padding:8px 11px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.field input::placeholder,.field textarea::placeholder{color:var(--txt3)}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field select option{background:var(--bg3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card-title{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.pur{background:var(--acc2)}

/* STAT CARDS */
.sc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:0;transition:opacity .2s}
.sc:hover::before{opacity:1}
.sl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.sv{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.ss{font-size:10px;color:var(--txt3);margin-top:4px}
.sv.pink{color:var(--acc)}.sv.purple{color:var(--acc2)}.sv.blue{color:var(--acc3)}.sv.ok{color:var(--ok)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 12px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--bd);font-weight:500;white-space:nowrap;background:rgba(0,0,0,.15)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--txt2)}
th.sort-asc::after{content:' ↑';color:var(--acc)}
th.sort-desc::after{content:' ↓';color:var(--acc)}
td{padding:9px 12px;border-bottom:1px solid var(--bd);color:var(--txt2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(244,114,154,.025)}
.td-act{display:flex;gap:6px;flex-wrap:wrap}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;letter-spacing:.3px;white-space:nowrap}
.bpk{background:rgba(244,114,154,.15);color:var(--acc)}
.bg{background:rgba(63,207,142,.12);color:var(--ok)}
.br{background:rgba(255,94,94,.12);color:var(--bad)}
.bw{background:rgba(245,166,35,.12);color:var(--warn)}
.bb{background:rgba(79,158,255,.12);color:#4f9eff}
.bpur{background:rgba(201,108,232,.12);color:var(--acc2)}
code{background:var(--bg4);border-radius:5px;padding:2px 6px;font-size:11px;color:var(--acc2);font-family:'JetBrains Mono',monospace}

/* MODAL */
#mo{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);align-items:center;justify-content:center}
#mo.open{display:flex}
.mo-box{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;padding:24px;width:500px;max-width:94vw;max-height:88vh;overflow-y:auto}
.mo-box.wide{width:680px}
.mo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mo-title{font-family:'Syne',sans-serif;font-weight:600;font-size:15px}
.mo-close{background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s}
.mo-close:hover{color:var(--txt)}
.mo-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* TOAST */
#toast{position:fixed;bottom:22px;right:22px;background:var(--bg3);border:1px solid var(--bd2);border-radius:9px;padding:11px 16px;font-size:12px;color:var(--txt);z-index:9999;transform:translateY(50px);opacity:0;transition:all .22s;max-width:320px}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#toast.err{border-color:var(--bad);color:var(--bad)}
#toast.warn{border-color:var(--warn);color:var(--warn)}

/* MISC */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-head h2{font-family:'Syne',sans-serif;font-weight:600;font-size:16px}
.empty{color:var(--txt3);font-size:12px;padding:16px 0}
.divider{border:none;border-top:1px solid var(--bd);margin:16px 0}

/* SQL box */
.sql-box{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--txt2);white-space:pre-wrap;line-height:1.6;position:relative}
.sql-copy{position:absolute;top:8px;right:8px;background:var(--bg3);border:1px solid var(--bd);color:var(--txt3);cursor:pointer;font-size:10px;padding:3px 8px;border-radius:5px;font-family:'Inter',sans-serif;transition:all .15s}
.sql-copy:hover{color:var(--txt);border-color:var(--bd2)}

/* KV grid (user profile) */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kvi{background:var(--bg3);border-radius:7px;padding:10px 12px;position:relative}
.kvi:hover .kv-edit-btn{opacity:1}
.kv-edit-btn{position:absolute;top:6px;right:6px;opacity:0;background:none;border:none;cursor:pointer;color:var(--txt3);font-size:12px;padding:2px 5px;transition:opacity .15s,color .15s;border-radius:4px;font-family:'Inter',sans-serif}
.kv-edit-btn:hover{color:var(--acc);background:rgba(244,114,154,.12)}
.kvk{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.kvv{font-size:12px;color:var(--txt);word-break:break-all}

/* IE rows */
.ie-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.ie-row:last-child{border-bottom:none}
.ie-key{color:var(--txt2);font-size:12px}
.ie-val{color:var(--txt);font-size:12px;font-family:'JetBrains Mono',monospace}
.ie-edit{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;transition:all .15s;font-family:'Inter',sans-serif}
.ie-edit:hover{color:var(--acc);background:rgba(244,114,154,.1)}

/* Source bar */
.src-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.src-fill{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));min-width:4px}
.src-name{font-size:11px;color:var(--txt2);width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-count{font-size:11px;color:var(--txt3);width:30px;text-align:right;flex-shrink:0}

/* Spinner */
.spin{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* formatting toolbar */
.fmt-bar{display:flex;gap:2px;padding:4px;background:var(--bg3);border:1px solid var(--bd);border-bottom:none;border-radius:8px 8px 0 0}
.fmt-bar .btn{border-radius:4px;padding:3px 8px;font-size:12px;min-width:28px;justify-content:center}
.fmt-bar+.field textarea,.fmt-bar~.field textarea{border-radius:0 0 8px 8px}

/* overview mini-activity */
.act-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px;background:var(--bg4)}
.act-dot.d1{background:rgba(244,114,154,.35)}
.act-dot.d2{background:rgba(244,114,154,.6)}
.act-dot.d3{background:rgba(244,114,154,.85)}
.act-dot.d4{background:var(--acc)}

/* filter row */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter-input{background:var(--bg3);border:1px solid var(--bd);color:var(--txt);padding:7px 12px;border-radius:8px;font:inherit;font-size:12px;outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--acc)}
.filter-input::placeholder{color:var(--txt3)}
select.filter-input{cursor:pointer}

/* user profile page */
.user-profile-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:18px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r)}
.user-avatar-lg{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;font-family:'Syne',sans-serif;font-weight:800;color:#fff}
.user-profile-name{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}
.user-profile-meta{font-size:11px;color:var(--txt3);margin-top:3px}

/* promo uses mini table inside modal */
.mini-table{width:100%;border-collapse:collapse;font-size:12px}
.mini-table th{text-align:left;padding:5px 8px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--bd);background:rgba(0,0,0,.2)}
.mini-table td{padding:6px 8px;border-bottom:1px solid var(--bd);color:var(--txt2)}
.mini-table tr:last-child td{border-bottom:none}

@media(max-width:720px){
  #sidebar{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
</style>
</head>

      <div class="login-logo-icon">♥</div>

        <div class="login-logo-name">Вместе</div>

<div id="sidebar">

      <div class="logo-text">Вместе</div>

    <div class="nav-item" onclick="go('admins')" data-page="admins"><span class="ic">◈</span>Аккаунты</div>

<div id="main">
  <div id="header">
    <div class="header-bc">Вместе / <span id="page-title">Сводка</span></div>

      <button class="btn" onclick="refreshCurrent()">↻ Обновить</button>

    </div>

</div>

</div><!-- /#app -->

<!-- MODAL -->
<div id="mo" onclick="closeMo(event)">
  <div class="mo-box" id="mo-box">
    <div class="mo-head">
      <div class="mo-title" id="mt"></div>
      <button class="mo-close" onclick="closeMo()">×</button>

</div>

<div id="toast"></div>

/* ══════════════ HARDCODED CREDENTIALS ══════════════ */
const SB_URL = 'https://kscxfeqmraklylaudtnf.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzY3hmZXFtcmFrbHlsYXVkdG5mIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTc0MjE5MiwiZXhwIjoyMDk1MzE4MTkyfQ.blVQ7D4pmtgYxkCsn1oIjJzy77B1VsN4yJQmtvOnMeE';

/* ══════════════ STATE ══════════════ */
const S = { me: null, page: 'overview', url: SB_URL, key: SB_KEY };

/* ══════════════ SUPABASE REST ══════════════ */
function rest(p){ return SB_URL.replace(/\/$/, '') + '/rest/v1/' + p; }
function hdrs(x={}){ return { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json', ...x }; }
async function api(path, opts={}){
  const r = await fetch(rest(path), {...opts, headers:hdrs(opts.headers||{})});
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error(t||'Supabase '+r.status); }
  if(r.status===204) return null;
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function sel(t,q='select=*'){ return (await api(t+'?'+q))||[]; }
async function ins(t,row){ return api(t,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(row)}); }
async function upd(t,q,row){ return api(t+'?'+q,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(row)}); }
async function del(t,q){ return api(t+'?'+q,{method:'DELETE'}); }

async function doLogin(){
  const login = document.getElementById('ls-login').value.trim();
  const pass  = document.getElementById('ls-pass').value;
  if(!login||!pass){ showLoginErr('Введи логин и пароль.'); return; }
  const btn = document.getElementById('ls-login-btn');
  btn.disabled=true; btn.textContent='Входим…';
  try{
    // сначала пробуем таблицу console_accounts
    let me = null;
    try{
      const rows = await sel('console_accounts',
        `select=*&login=eq.${encodeURIComponent(login)}&password_hash=eq.${encodeURIComponent(pass)}&is_active=eq.true&limit=1`);
      if(rows.length) me = rows[0];
    }catch(e2){
      // таблица не существует — первый запуск
      if(e2.message.includes('42P01')||e2.message.includes('does not exist')){
        me = {login, display_name: login, role:'superadmin'};
      } else { throw e2; }
    }
    if(!me){ showLoginErr('Неверный логин или пароль.'); return; }
    S.me = me;
    localStorage.setItem('vmeste_session', JSON.stringify(me));
    startApp();
  }catch(e){ showLoginErr(e.message); }
  finally{ btn.disabled=false; btn.textContent='Войти'; }
}

function doLogout(){ localStorage.removeItem('vmeste_session'); location.reload(); }
function showLoginErr(m){ const el=document.getElementById('login-err'); el.textContent=m; el.classList.add('show'); }

function startApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').style.display='flex';
  const initials = (S.me.display_name||S.me.login||'?').charAt(0).toUpperCase();
  document.getElementById('profile-av').textContent = initials;
  document.getElementById('profile-name').textContent = S.me.display_name||S.me.login;
  setConn(true);
  go('overview');
}

  const m = S.me||{};
  openMo('Мой профиль', `
    <div class="user-profile-header" style="margin-bottom:0">
      <div class="user-avatar-lg">${(m.display_name||m.login||'?').charAt(0).toUpperCase()}</div>
      <div>

    <div class="field"><label>Отображаемое имя</label><input id="mp-name" value="${esc(m.display_name||'')}"></div>

async function saveMyProfile(){
  const pass = document.getElementById('mp-pass')?.value;
  const name = document.getElementById('mp-name')?.value.trim();
  if(!S.me?.id){ toast('ID аккаунта неизвестен — войди через таблицу', 'warn'); closeMo(); return; }
  const fields = {};
  if(pass) fields.password_hash = pass;
  if(name) fields.display_name = name;
  if(!Object.keys(fields).length){ closeMo(); return; }
  try{
    await upd('console_accounts',`id=eq.${S.me.id}`,fields);
    if(name){ S.me.display_name=name; document.getElementById('profile-name').textContent=name; localStorage.setItem('vmeste_session',JSON.stringify(S.me)); }
    closeMo(); toast('Профиль обновлён ✓','ok');
  }catch(e){ toast(e.message,'err'); }
}

async function users(){

      sel('card_logs','select=tg_id,style').catch(()=>[]),

function getSortedFilteredUsers(){
  const q = (document.getElementById('u-search')?.value||'').toLowerCase();
  const prem = document.getElementById('u-premium')?.value||'';
  const rem  = document.getElementById('u-reminder')?.value||'';
  let rows = _usersData.filter(u=>{
    if(q && !String(u.tg_id).includes(q) && !(u.my_name||'').toLowerCase().includes(q) && !(u.partner_name||'').toLowerCase().includes(q)) return false;
    if(prem==='1' && !u.is_premium) return false;
    if(prem==='0' && u.is_premium) return false;
    if(rem==='1' && !u.reminder_enabled) return false;
    if(rem==='0' && u.reminder_enabled) return false;
    return true;
  });
  const {col,dir} = _usersSort;
  rows.sort((a,b)=>{
    let va=a[col]??'', vb=b[col]??'';
    if(typeof va==='boolean') va=va?1:0, vb=vb?1:0;
    const cmp = String(va).localeCompare(String(vb), undefined, {numeric:true});
    return dir==='asc'?cmp:-cmp;
  });
  return rows;
}

function sortUsers(col){
  if(_usersSort.col===col) _usersSort.dir = _usersSort.dir==='asc'?'desc':'asc';
  else { _usersSort.col=col; _usersSort.dir='asc'; }
  renderUsersPage();
}

  }

function openFieldEdit(tg_id, key, val, type, optsStr, optLabelsStr){
  const opts = optsStr ? optsStr.split(',').filter(Boolean) : [];
  const optLabels = optLabelsStr ? Object.fromEntries(optLabelsStr.split(',').filter(Boolean).map(p=>{const [k,v]=p.split(':');return[k,v||k];})) : {};
  let inputHtml;
  if(type==='select' && opts.length){
    inputHtml = `<select id="fe-val" class="filter-input" style="width:100%">${opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(optLabels[o]||o)}</option>`).join('')}</select>`;
  } else if(type==='date'){
    inputHtml = `<input id="fe-val" type="date" class="filter-input" style="width:100%" value="${esc(val)}">`;
  } else {
    inputHtml = `<input id="fe-val" class="filter-input" style="width:100%" value="${esc(val)}" placeholder="Новое значение">`;
  }
  openMo('Изменить: '+key,`
    <div class="field"><label>${key}</label>${inputHtml}</div>
    <div style="font-size:11px;color:var(--txt3);margin-top:-6px">Оставь пустым для null</div>
  `,[
    {l:'Отмена',c:'',o:'closeMo()'},
    {l:'Сохранить',c:'acc',o:`doFieldEdit(${tg_id},'${key}')`},
  ]);
}

async function doFieldEdit(tg_id, key){
  const val = document.getElementById('fe-val')?.value.trim();
  const data = {[key]: val===''?null:val};
  try{
    await upd('users',`tg_id=eq.${tg_id}`,data);
    closeMo();
    toast(`${key} обновлён ✓`,'ok');
    // обновляем кэш
    const idx = _usersData.findIndex(u=>u.tg_id==tg_id);
    if(idx!==-1) _usersData[idx][key] = val===''?null:val;
    renderUserProfilePage(_usersData[idx]||{tg_id});
  }catch(e){ toast(e.message,'err'); }
}

async function toggleUserBool(tg_id, key, val){
  try{
    await upd('users',`tg_id=eq.${tg_id}`,{[key]:val});
    toast(`${key} → ${val?'вкл':'выкл'}`,'ok');
    const idx=_usersData.findIndex(u=>u.tg_id==tg_id);
    if(idx!==-1){ _usersData[idx][key]=val; renderUserProfilePage(_usersData[idx]); }
  }catch(e){ toast(e.message,'err'); }
}

let _promosData=[], _promosSort={col:'status_order',dir:'asc'};
async function promos(){
  set(spinner());
  try{
    const [rows, uses] = await Promise.all([
      sel('promo_codes','select=*&order=used_count.desc'),
      sel('promo_uses','select=*&order=used_at.desc&limit=500'),
    ]);
    _promosData = rows;
    _promosUses = uses||[];
    renderPromosPage(uses);
  }catch(e){ set(errBox(e)); }
}

function getPromoStatus(p){
  if(p.expires_at && new Date(p.expires_at)<new Date()) return 'expired';
  if(p.max_uses && p.used_count>=p.max_uses) return 'limit';
  return 'active';
}

function renderPromosPage(uses){
  if(!uses) uses = _promosUses;
  const prevSearch = document.getElementById('pr-search')?.value ?? '';
  const prevStatus = document.getElementById('pr-status')?.value ?? '';
  const prevType = document.getElementById('pr-type')?.value ?? '';
  const prevUses = document.getElementById('pr-uses')?.value ?? '';

  let rows = _promosData.map(p=>({...p, _status:getPromoStatus(p)}));

  if(prevSearch) rows = rows.filter(p=>p.code.toLowerCase().includes(prevSearch.toLowerCase()));
  if(prevStatus) rows = rows.filter(p=>p._status===prevStatus);
  if(prevType==='free') rows = rows.filter(p=>p.is_free);
  if(prevType==='discount') rows = rows.filter(p=>!p.is_free);
  if(prevUses==='used') rows = rows.filter(p=>p.used_count>0);
  if(prevUses==='unused') rows = rows.filter(p=>!p.used_count);

  // Sort: active first by default
  rows.sort((a,b)=>{
    const order = {active:0,limit:1,expired:2};
    return (order[a._status]??3)-(order[b._status]??3);
  });

  // Uses data grouped by code
  const usesMap = {};
  if(uses){
    for(const u of uses){
      if(!usesMap[u.code]) usesMap[u.code]=[];
      usesMap[u.code].push(u);
    }
  }

  set(`
    <div class="section-head">
      <h2>Промокоды</h2>
      <button class="btn acc" onclick="openCreatePromo()">+ Создать промокод</button>
    </div>
    <div class="filter-row">
      <input class="filter-input" id="pr-search" placeholder="Поиск по коду…" style="width:180px" value="${esc(prevSearch)}" oninput="renderPromosPage()">
      <select class="filter-input" id="pr-status" onchange="renderPromosPage()">
        <option value="" ${prevStatus===''?'selected':''}>Все статусы</option>
        <option value="active" ${prevStatus==='active'?'selected':''}>Активные</option>
        <option value="expired" ${prevStatus==='expired'?'selected':''}>Истёкшие</option>
        <option value="limit" ${prevStatus==='limit'?'selected':''}>Лимит исчерпан</option>
      </select>
      <select class="filter-input" id="pr-type" onchange="renderPromosPage()">
        <option value="" ${prevType===''?'selected':''}>Все типы</option>
        <option value="free" ${prevType==='free'?'selected':''}>Free premium</option>
        <option value="discount" ${prevType==='discount'?'selected':''}>Скидка</option>
      </select>
      <select class="filter-input" id="pr-uses" onchange="renderPromosPage()">
        <option value="" ${prevUses===''?'selected':''}>Все использования</option>
        <option value="used" ${prevUses==='used'?'selected':''}>Использовались</option>
        <option value="unused" ${prevUses==='unused'?'selected':''}>Не использовались</option>
      </select>
      <span style="font-size:11px;color:var(--txt3)">Показано: ${rows.length}</span>
    </div>
    <div class="card" style="padding:0">
      <div class="tw">
        <table>
          <thead><tr><th>Код</th><th>Тип</th><th>Скидка</th><th>Использовано</th><th>Лимит</th><th>Активен до</th><th>Статус</th><th></th></tr></thead>
          <tbody>${rows.length?rows.map(renderPromoRow).join(''):'<tr><td colspan="8"><div class="empty">Промокодов нет. Создай первый!</div></td></tr>'}</tbody>
        </table>
      </div>
    </div>

    ${(uses && uses.length) ? `
    <div style="margin-top:20px">
      <div class="section-head"><h2 style="font-size:14px">История использований <span style="color:var(--txt3);font-size:12px;font-weight:400">(${uses.length})</span></h2></div>
      <div class="card" style="padding:0">
        <div class="tw">
          <table>
            <thead><tr><th>Дата</th><th>Промокод</th><th>TG ID</th></tr></thead>
            <tbody>${uses.slice(0,200).map(u=>`<tr>
              <td style="color:var(--txt3)">${fd(u.used_at)}</td>
              <td><code>${esc(u.code)}</code></td>
              <td><code>${u.tg_id}</code></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>` : ''}
  `);
}

// Store uses for re-render without re-fetch
let _promosUses = [];

function renderPromoRow(p){
  const status = p._status || getPromoStatus(p);
  const sb = {active:'<span class="badge bg">активен</span>',expired:'<span class="badge br">истёк</span>',limit:'<span class="badge bw">лимит</span>'}[status];
  return `<tr>
    <td><code>${esc(p.code)}</code></td>
    <td>${p.is_free?'<span class="badge bg">free premium</span>':'<span class="badge bpk">скидка</span>'}</td>
    <td>${p.is_free?'—':(p.discount||0)+'%'}</td>
    <td>${p.used_count||0}</td>
    <td>${p.max_uses||'∞'}</td>
    <td>${p.expires_at||'без даты'}</td>
    <td>${sb}</td>
    <td><div class="td-act">
      <button class="btn sm" onclick="openEditPromo('${esc(p.code)}')">✎</button>
      <button class="btn sm dan" onclick="confirmDeletePromo('${esc(p.code)}')">✕</button>
    </div></td>
  </tr>`;
}

function openCreatePromo(){
  openMo('Создать промокод',promoFormHtml(),[{l:'Отмена',c:'',o:'closeMo()'},{l:'Создать',c:'acc',o:'doCreatePromo()'}]);
  setTimeout(togglePromoKind,10);
}
function openEditPromo(code){
  const p=_promosData.find(r=>r.code===code); if(!p) return;
  openMo('Редактировать промокод',promoFormHtml(p),[{l:'Отмена',c:'',o:'closeMo()'},{l:'Сохранить',c:'acc',o:'doCreatePromo(true)'}]);
  setTimeout(togglePromoKind,10);
}
function promoFormHtml(p){
  return `
    <div class="g2">
      <div class="field"><label>Код</label>
        <input id="pf-code" value="${esc(p?.code||'')}" placeholder="LOVE50" ${p?'readonly':''} style="${p?'opacity:.5':''}" oninput="this.value=this.value.toUpperCase()">
      </div>
      <div class="field"><label>Тип</label>
        <select id="pf-kind" onchange="togglePromoKind()">
          <option value="discount" ${!p?.is_free?'selected':''}>Скидка %</option>

function togglePromoKind(){
  const el=document.getElementById('pf-discount-row');
  if(el) el.style.display=document.getElementById('pf-kind')?.value==='free'?'none':'';
}
async function doCreatePromo(isEdit=false){
  const code=document.getElementById('pf-code')?.value.trim().toUpperCase();
  if(!code){ toast('Введи код','err'); return; }
  const is_free=document.getElementById('pf-kind')?.value==='free';
  const row={code,is_free,discount:is_free?0:Number(document.getElementById('pf-discount')?.value||0),max_uses:document.getElementById('pf-maxuses')?.value?Number(document.getElementById('pf-maxuses').value):null,expires_at:document.getElementById('pf-expires')?.value||null};
  try{
    if(isEdit){ await upd('promo_codes',`code=eq.${encodeURIComponent(code)}`,row); }
    else{ row.used_count=0; await ins('promo_codes',row); }
    closeMo(); toast(isEdit?`${code} обновлён ✓`:`${code} создан ✓`,'ok'); promos();
  }catch(e){ toast(e.message,'err'); }
}
function confirmDeletePromo(code){
  openMo('Удалить промокод?',`<div style="color:var(--txt2)">Промокод <code>${esc(code)}</code> и история его использований будут удалены безвозвратно.</div>`,[
    {l:'Отмена',c:'',o:'closeMo()'},
    {l:'Удалить',c:'dan',o:`doDeletePromo('${esc(code)}')`},
  ]);
}
async function doDeletePromo(code){
  try{
    await del('promo_codes',`code=eq.${encodeURIComponent(code)}`);
    closeMo(); toast(`${code} удалён`,'warn'); promos();
  }catch(e){ toast(e.message,'err'); }
}

/* ══════════════ CONTACTS (outreach) ══════════════ */
async function contacts(){
  set(spinner());
  try{

      sel('outreach_targets','select=*&order=created_at.desc'),
      sel('outreach_messages','select=sent_at'),

    const LIMIT=5;
    set(`
      <div class="section-head">
        <h2>Контакты для рассылки</h2>
        <div style="display:flex;gap:8px">
          <button class="btn acc" onclick="openAddTarget()">+ Добавить</button>
          <button class="btn" onclick="loadContactQueue()">Очередь на сегодня</button>
        </div>
      </div>
      <div class="g2" style="margin-bottom:14px">
        ${sc('Отправлено сегодня',sentToday+'/'+LIMIT,'Дневной лимит','')}
        ${sc('В очереди',targets.filter(t=>['new','queued'].includes(t.status)).length,'Новых + в очереди','')}
      </div>
      <div id="contact-queue" style="margin-bottom:14px"></div>
      <div class="card" style="padding:0">
        <div class="tw">
          <table>
            <thead><tr><th>#</th><th>Контакт</th><th>Канал</th><th>Тема</th><th>Статус</th><th>Промокод</th><th>Заметка</th><th></th></tr></thead>
            <tbody>
              ${targets.length?targets.map(t=>`<tr>
                <td style="color:var(--txt3)">${t.id}</td>
                <td>${esc(t.contact)}</td>
                <td>${esc(t.channel_title||'')}</td>
                <td>${esc(t.topic||'')}</td>
                <td>${contactStatusBadge(t.status)}</td>
                <td>${t.promo_code?`<code>${esc(t.promo_code)}</code>`:''}</td>
                <td style="color:var(--txt3);font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.notes||'')}</td>
                <td><div class="td-act">
                  <button class="btn sm" onclick="openEditTarget(${t.id})">✎</button>
                  <button class="btn sm suc" onclick="markContactSent(${t.id})">✓</button>
                  <button class="btn sm warn" onclick="markContactSkipped(${t.id})">Пропустить</button>
                  <button class="btn sm dan" onclick="confirmDeleteTarget(${t.id})">✕</button>
                </div></td>
              </tr>`).join(''):'<tr><td colspan="8"><div class="empty">Список пуст</div></td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `);
    window._targetsData=targets;
  }catch(e){ set(errBox(e)); }
}

function contactStatusBadge(s){
  if(s==='sent') return '<span class="badge bg">отправлено</span>';
  if(s==='skipped') return '<span class="badge bw">пропущен</span>';
  if(s==='queued') return '<span class="badge bb">в очереди</span>';
  return '<span class="badge">новый</span>';
}

async function loadContactQueue(){
  const targets=(window._targetsData||[]).filter(t=>['new','queued'].includes(t.status)).slice(0,5);
  const el=document.getElementById('contact-queue'); if(!el) return;
  if(!targets.length){ el.innerHTML='<div class="card"><div class="empty">Нет контактов в очереди</div></div>'; return; }
  el.innerHTML=targets.map(t=>{
    const text=outreachText(t);
    return `<div class="card" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div><strong>#${t.id}</strong> <span style="color:var(--txt3)">${esc(t.contact)}</span></div>
        <span style="font-size:11px;color:var(--txt3)">${esc(t.channel_title||'')}</span>
      </div>
      <textarea id="qt_${t.id}" style="width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--txt2);padding:9px;border-radius:7px;font:inherit;font-size:12px;line-height:1.5;min-height:110px;resize:vertical;outline:none">${esc(text)}</textarea>
      <div style="display:flex;gap:8px;margin-top:9px">
        <button class="btn sm" onclick="copyText(document.getElementById('qt_${t.id}').value)">Копировать</button>
        <button class="btn sm suc" onclick="markContactSent(${t.id})">✓ Отправлено</button>
        <button class="btn sm warn" onclick="markContactSkipped(${t.id})">Пропустить</button>
      </div>
    </div>`;
  }).join('');
}

function outreachText(t){
  const title=t.channel_title||'ваш канал', topic=t.topic||'отношения';
  const promo=t.promo_code?`\n\nДля вашей аудитории могу дать промокод ${t.promo_code}.`:'';
  const link=`https://t.me/TogetherDayBot?start=src_partner_${t.id}`;
  return `Привет! Увидел ${title} — у вас хорошо заходит тема «${topic}».\n\nЯ сделал Telegram-бота «Вместе»: он создаёт красивую карточку для пары с количеством дней вместе. Формат хорошо шарится в личные каналы и партнёру.\n\nМожем сделать лёгкое сотрудничество: вы публикуете пост/историю, а я даю отдельную ссылку, чтобы было видно результат.${promo}\n\nСсылка: ${link}`;
}

async function markContactSent(id){
  try{
    const text=document.getElementById('qt_'+id)?.value||outreachText((window._targetsData||[]).find(t=>t.id===id)||{});
    await ins('outreach_messages',{target_id:id,message_text:text});
    await upd('outreach_targets',`id=eq.${id}`,{status:'sent',last_contacted_at:new Date().toISOString()});
    toast(`#${id} отмечен как отправленный ✓`,'ok'); contacts();
  }catch(e){ toast(e.message,'err'); }
}
async function markContactSkipped(id){
  try{ await upd('outreach_targets',`id=eq.${id}`,{status:'skipped'}); toast(`#${id} пропущен`,'warn'); contacts(); }catch(e){ toast(e.message,'err'); }
}

/* ══════════════ BROADCAST ══════════════ */
async function broadcast(){
  set(spinner());
  try{
    let usrs;
    try {
      usrs = await sel('users','select=tg_id,is_premium,my_name,partner_name,username');
    } catch(e) {
      usrs = await sel('users','select=tg_id,is_premium,my_name,partner_name');
    }
    const [pending, bcs] = await Promise.all([
      sel('pending_users','select=tg_id').catch(()=>[]),
      sel('broadcasts','select=*&order=created_at.desc&limit=30').catch(()=>[]),
    ]);
    const allCount = usrs.length;
    const premCount = usrs.filter(u=>u.is_premium).length;
    const freeCount = allCount - premCount;
    const pendCount = (pending||[]).length;

    const statusBadge = s => ({
      'pending':'<span class="badge bw">ожидает</span>',
      'sending':'<span class="badge bb">отправляется…</span>',
      'done':'<span class="badge bg">готово</span>',
      'failed':'<span class="badge br">ошибка</span>',
    }[s]||`<span class="badge">${esc(s)}</span>`);

    set(`
      <div class="section-head">
        <h2>Рассылка</h2>
        <button class="btn acc" onclick="openNewBroadcast(${allCount},${premCount},${freeCount},${pendCount})">+ Новая рассылка</button>
      </div>

      <!-- Аудитории -->
      <div class="g4" style="margin-bottom:20px">
        ${sc('Все пользователи',allCount,'Зарегистрированы в боте','')}
        ${sc('Премиум',premCount,'is_premium = true','pink')}
        ${sc('Без премиума',freeCount,'is_premium = false','blue')}
        ${sc('Незавершённые',pendCount,'Не прошли флоу регистрации','warn')}
      </div>

      <!-- История рассылок -->
      <div class="card" style="padding:0">
        <div style="padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between">
          <div class="card-title" style="margin:0"><div class="dot"></div>История рассылок</div>
          <button class="btn sm" onclick="broadcast()">↻</button>
        </div>
        <div class="tw">
          <table>
            <thead><tr>
              <th>#</th><th>Кому</th><th>Текст</th><th>Отправлено</th><th>Ошибок</th><th>Статус</th><th>Дата</th><th></th>
            </tr></thead>
            <tbody>${(bcs&&bcs.length)?bcs.map(b=>`<tr>
              <td style="color:var(--txt3)">${b.id}</td>
              <td><span class="badge ${b.audience==='all'?'bg':b.audience==='premium'?'bpk':b.audience==='pending'?'bw':'bpur'}">${esc(b.audience)}</span></td>
              <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt2)">${esc((b.text||'').slice(0,80))}${(b.text||'').length>80?'…':''}</td>
              <td>${b.sent_count||0}</td>

/* Markdown formatting toolbar */
function bcFormat(type){
  const ta=document.getElementById('bc-text');
  if(!ta) return;
  const start=ta.selectionStart, end=ta.selectionEnd;
  const sel=ta.value.substring(start,end);
  let before='', after='';
  if(type==='bold'){ before='*'; after='*'; }
  else if(type==='italic'){ before='_'; after='_'; }
  else if(type==='strike'){ before='~'; after='~'; }
  else if(type==='code'){ before='`'; after='`'; }
  else if(type==='link'){
    if(sel){ before='['; after='](https://)'; }
    else { before='['; after='](https://)'; }
  }
  const replacement=sel?(before+sel+after):(before+after);
  ta.setRangeText(replacement,start,end,'select');
  ta.focus();
  if(!sel){
    ta.selectionStart=start+before.length;
    ta.selectionEnd=start+before.length;
  }
  bcPreview();
}

function bcPreview(){
  const ta=document.getElementById('bc-text');
  const preview=document.getElementById('bc-preview');
  if(!ta||!preview) return;
  const text=ta.value;
  if(!text.trim()){ preview.style.display='none'; return; }
  preview.style.display='block';
  let html=esc(text);
  html=html.replace(/\*(.+?)\*/g,'<strong>$1</strong>');
  html=html.replace(/_(.+?)_/g,'<em>$1</em>');
  html=html.replace(/~(.+?)~/g,'<s>$1</s>');
  html=html.replace(/`(.+?)`/g,'<code style="background:var(--bg4);padding:1px 4px;border-radius:3px;font-size:11px">$1</code>');
  html=html.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" style="color:var(--acc)">$1</a>');
  preview.innerHTML=html;
}

async function doSendBroadcast(){
  const aud=document.getElementById('bc-aud')?.value||'all';
  const text=(document.getElementById('bc-text')?.value||'').trim();
  if(!text){ toast('Введи текст рассылки','err'); return; }

  let targetIds=[];
  if(aud==='pending'){
    try{
      const rows=await sel('pending_users','select=tg_id');
      targetIds=rows.map(r=>r.tg_id);
    }catch(e){ toast('Не удалось получить pending-юзеров: '+e.message,'err'); return; }
    if(!targetIds.length){ toast('Нет pending-пользователей','warn'); return; }
  } else if(aud==='specific'){
    targetIds=[..._bcDraftIds];
    if(!targetIds.length){ toast('Выбери хотя бы одного пользователя','err'); return; }
  }

  let mediaBase64=null, mediaType=null;
  if(_bcMediaFile){
    try{
      const buf=await _bcMediaFile.arrayBuffer();
      const bytes=new Uint8Array(buf);
      let binary=''; for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
      mediaBase64=btoa(binary);
      mediaType=_bcMediaFile.type||'image/png';
    }catch(e){ toast('Ошибка чтения файла: '+e.message,'err'); return; }
  }

  const audience = aud==='pending'?'specific':aud;
  const payload={
    created_by: S.me?.login||'console',
    audience,
    target_ids: targetIds,
    text,
    status:'pending',
    sent_count:0,
    fail_count:0,
  };
  if(mediaBase64 && mediaType){
    payload.media_base64 = mediaBase64;
    payload.media_type = mediaType;
  }
  try{
    await ins('broadcasts',payload);
    closeMo();
    toast('Рассылка поставлена в очередь ✓','ok');
    broadcast();
  }catch(e){
    if(e.message&&e.message.includes('column')&&e.message.includes('media')){
      toast('Таблица broadcasts не поддерживает медиа. Выполни SQL в БД:\nALTER TABLE broadcasts ADD COLUMN media_base64 TEXT;\nALTER TABLE broadcasts ADD COLUMN media_type TEXT;','err');
    } else { toast(e.message,'err'); }
  }
}

async function dbRunSelect(){
  const table = document.getElementById('db-table')?.value.trim();
  const query = document.getElementById('db-query')?.value.trim() || 'select=*&limit=20';
  if(!table){ toast('Введи название таблицы','err'); return; }
  const resEl = document.getElementById('db-result');
  const metaEl = document.getElementById('db-result-meta');
  const boxEl = document.getElementById('db-result-box');
  resEl.style.display='none';
  try{
    const rows = await sel(table, query);
    resEl.style.display='block';
    metaEl.textContent = `Получено строк: ${Array.isArray(rows)?rows.length:1} · ${table}?${query}`;
    boxEl.textContent = JSON.stringify(rows, null, 2);
  }catch(e){
    resEl.style.display='block';
    metaEl.textContent = 'Ошибка запроса';
    boxEl.textContent = e.message;
    boxEl.style.color='var(--bad)';
  }
}
function dbClear(){

  const b=document.getElementById('db-result-box'); if(b) b.style.color='';
}

/* ══════════════ HELPERS ══════════════ */
function esc(v){ return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
function fd(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch{ return d; } }
function spinner(){ return '<div style="color:var(--txt3);padding:40px 0;text-align:center"><span class="spin"></span></div>'; }
function errBox(e){ return `<div class="card"><div style="color:var(--bad);margin-bottom:6px">Ошибка загрузки</div><div style="color:var(--txt3);font-size:12px;white-space:pre-wrap">${esc(e.message)}</div></div>`; }
function setConn(ok){ document.getElementById('conn-dot').className='conn-dot'+(ok?' ok':''); document.getElementById('conn-label').textContent=ok?'Подключено':'Нет соединения'; }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('Скопировано ✓','ok'); }catch{ toast('Не удалось скопировать','err'); } }
function sc(label,val,sub,accent){ const cls=accent==='pink'?'pink':accent==='purple'?'purple':accent==='blue'?'blue':accent==='ok'?'ok':''; return `<div class="sc"><div class="sl">${label}</div><div class="sv ${cls}">${esc(String(val))}</div><div class="ss">${sub}</div></div>`; }
function sqlBox(sql){ const id='sql_'+Math.random().toString(36).slice(2,8); return `<div class="sql-box" id="${id}">${esc(sql)}<button class="sql-copy" onclick="copyText(document.getElementById('${id}').textContent.replace('Копировать','').trim())">Копировать</button></div>`; }
function kv(label,val){ return `<div class="kvi"><div class="kvk">${label}</div><div class="kvv">${esc(val)}</div></div>`; }

let _toastT;
function toast(msg,type=''){ const el=document.getElementById('toast'); el.textContent=msg; el.className='show'+(type?' '+type:''); clearTimeout(_toastT); _toastT=setTimeout(()=>{el.className='';},2800); }

function openMo(title,body,actions=[]){
  document.getElementById('mo-box').classList.remove('wide');
  document.getElementById('mt').textContent=title;
  document.getElementById('mb').innerHTML=body;
  document.getElementById('ma').innerHTML=actions.map(a=>`<button class="btn ${a.c||''}" onclick="${a.o}">${a.l}</button>`).join('');
  document.getElementById('mo').classList.add('open');
}
function closeMo(e){ if(e&&e.target!==document.getElementById('mo')) return; document.getElementById('mo').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('mo').classList.remove('open'); });

/* ══════════════ BOOTSTRAP ══════════════ */
(function init(){
  const saved=localStorage.getItem('vmeste_session');
  if(saved){ try{ S.me=JSON.parse(saved); startApp(); return; }catch{} }
  // Enter key on login
  document.getElementById('ls-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('ls-login').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('ls-pass').focus(); });
})();
</script>
